# Deploy frontend to Firebase Hosting (yt-adwords) on push to main.
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  firebase-hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_TINA_CLIENT_ID: ${{ secrets.VITE_TINA_CLIENT_ID }}
          VITE_TINA_TOKEN: ${{ secrets.VITE_TINA_TOKEN }}
          VITE_TINA_BRANCH: main
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build
        # Tina Cloud: add your hosting URL in Tina Cloud → Configuration → Site URLs. Add VITE_TINA_CLIENT_ID and VITE_TINA_TOKEN as repo secrets.
        # Backend API: Add VITE_API_URL secret with your production API URL (e.g. https://youtubeadwords.onrender.com).

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting:yt-adwords --project socio-websites --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"

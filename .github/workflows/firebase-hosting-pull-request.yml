name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with TinaCMS
        working-directory: frontend
        env:
          VITE_TINA_CLIENT_ID: ${{ secrets.VITE_TINA_CLIENT_ID }}
          VITE_TINA_TOKEN: ${{ secrets.VITE_TINA_TOKEN }}
          TINA_CLIENT_ID: ${{ secrets.VITE_TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.VITE_TINA_TOKEN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci
          npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOCIO_WEBSITES }}
          projectId: socio-websites

# Deploy frontend to Firebase Hosting on push to main (like buzzoid.com).
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  firebase-hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TINA_CLIENT_ID: ${{ secrets.VITE_TINA_CLIENT_ID }}
          VITE_TINA_TOKEN: ${{ secrets.VITE_TINA_TOKEN }}
          TINA_CLIENT_ID: ${{ secrets.VITE_TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.VITE_TINA_TOKEN }}
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # If deploy fails with "Your credentials are no longer valid", generate a new token:
      # Run locally: firebase login:ci
      # Then in GitHub: repo → Settings → Secrets and variables → Actions → update FIREBASE_TOKEN
      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting:yt-adwords --project socio-websites --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"

# Deploy frontend to Firebase Hosting on push to main (like buzzoid.com).
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  firebase-hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Check Firebase secrets
        run: |
          if [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            echo "::error::FIREBASE_PROJECT_ID secret is not set. Add it in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_TOKEN }}" ]; then
            echo "::error::FIREBASE_TOKEN secret is not set. Run 'firebase login:ci' locally and add the token as FIREBASE_TOKEN."
            exit 1
          fi
          echo "Firebase secrets present."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Sync Tina schema to Tina Cloud
        working-directory: frontend
        env:
          VITE_TINA_CLIENT_ID: ${{ secrets.VITE_TINA_CLIENT_ID }}
          VITE_TINA_TOKEN: ${{ secrets.VITE_TINA_TOKEN }}
        run: npx tinacms build
        continue-on-error: true

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TINA_CLIENT_ID: ${{ secrets.VITE_TINA_CLIENT_ID }}
          VITE_TINA_TOKEN: ${{ secrets.VITE_TINA_TOKEN }}
        run: npm run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # FIREBASE_PROJECT_ID = your Firebase project id (e.g. yotubeadwords). Find in Firebase Console → Project settings.
      # FIREBASE_TOKEN = from `firebase login:ci` (repo → Settings → Secrets → Actions).
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive --token "$FIREBASE_TOKEN"

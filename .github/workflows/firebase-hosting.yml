# Deploy frontend to Firebase Hosting on push to main (like buzzoid.com).
#
# If deploy fails with "Your credentials are no longer valid":
#   1. On your machine run:  firebase login:ci
#   2. Open the URL, sign in, copy the token it prints.
#   3. In GitHub: repo → Settings → Secrets and variables → Actions
#   4. Add or update secret named FIREBASE_TOKEN with that token.
#
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        env:
          VITE_TINA_CLIENT_ID: ${{ secrets.VITE_TINA_CLIENT_ID }}
          VITE_TINA_TOKEN: ${{ secrets.VITE_TINA_TOKEN }}
          TINA_CLIENT_ID: ${{ secrets.VITE_TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.VITE_TINA_TOKEN }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting:yt-adwords --project socio-websites --non-interactive --token "${{ secrets.FIREBASE_TOKEN }}"
